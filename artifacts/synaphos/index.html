    <link rel="canonical" href="https://synaphos.com" />

    <meta property="og:title" content="Synaphos — Self-Hosted AI Workspace with On-Chain Intelligence" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="The workspace where intelligence lives on-chain. Self-hosted, open-source AI with trustless provenance, IPFS storage, and DAO governance." />
